<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — Smart Attendance System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .role-switcher {
            display: flex;
            background: var(--bg-subtle);
            border-radius: var(--radius-sm);
            padding: 4px;
            gap: 4px;
            margin-bottom: 20px;
        }

        .role-tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .role-tab-btn.active {
            background: #ffffff;
            color: var(--primary);
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>
<body>

    <!-- UNIFIED APP NAVBAR -->
    <header class="app-navbar">
        <div class="nav-brand" onclick="window.location.href='index.html'">
            <div class="nav-logo-icon">
                <i class="fa-solid fa-qrcode"></i>
            </div>
            <div class="nav-title-wrap">
                <span class="nav-title">Smart Attendance</span>
                <span class="nav-subtitle">MEA Engineering College</span>
            </div>
        </div>

        <div class="nav-actions">
            <a href="index.html" class="btn-nav">
                <i class="fa-solid fa-house"></i> Home
            </a>
            <a href="login.html" class="btn-nav btn-nav-primary">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </a>
        </div>
    </header>

    <!-- MAIN BENTO CONTAINER -->
    <main class="bento-container" style="max-width: 1000px; padding-top: 36px;">

        <div class="bento-grid">

            <!-- LEFT INFO BENTO CARD WITH AI ILLUSTRATION -->
            <div class="bento-card span-6" style="justify-content: space-between; background: linear-gradient(145deg, rgba(255, 255, 255, 0.95) 0%, rgba(240, 253, 244, 0.95) 100%);">
                <div>
                    <div style="width: 100%; height: 180px; border-radius: var(--radius-md); overflow: hidden; margin-bottom: 20px; box-shadow: var(--shadow-sm);">
                        <img src="images/register_graphic.jpg" alt="Registration Graphic" style="width: 100%; height: 100%; object-fit: cover;">
                    </div>

                    <h2 style="font-size: 26px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px;">
                        Join MEA Portal
                    </h2>
                    <p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.6;">
                        Create a Student or Teacher profile to manage classroom attendance.
                    </p>

                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <div style="padding: 10px 14px; background: rgba(255, 255, 255, 0.9); border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-size: 13px; font-weight: 700; color: var(--primary);">
                            <i class="fa-solid fa-user-graduate"></i> Student Profile
                        </div>
                        <div style="padding: 10px 14px; background: rgba(255, 255, 255, 0.9); border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-size: 13px; font-weight: 700; color: var(--success);">
                            <i class="fa-solid fa-chalkboard-user"></i> Teacher Profile
                        </div>
                    </div>
                </div>

                <div style="margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--border-color); display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-muted);">
                    <i class="fa-solid fa-graduation-cap" style="color: var(--success);"></i> MEA Engineering College
                </div>
            </div>

            <!-- RIGHT FORM BENTO CARD -->
            <div class="bento-card span-6" style="padding: 32px;">
                
                <div style="text-align: center; margin-bottom: 20px;">
                    <h3 style="font-size: 22px; font-weight: 800; color: var(--text-primary); margin-bottom: 4px;">Create Account</h3>
                    <p style="font-size: 14px; color: var(--text-muted);">Select role and enter your details</p>
                </div>

                <!-- Role Tabs -->
                <div class="role-switcher">
                    <button type="button" class="role-tab-btn active" id="tabStudent" onclick="selectRole('student')">
                        <i class="fa-solid fa-user-graduate"></i> Student
                    </button>
                    <button type="button" class="role-tab-btn" id="tabTeacher" onclick="selectRole('teacher')">
                        <i class="fa-solid fa-chalkboard-user"></i> Teacher
                    </button>
                </div>

                <!-- Hidden Real Select used by script.js -->
                <select id="role" style="display:none;" onchange="toggleRollNo()">
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                </select>

                <!-- Full Name -->
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <div class="input-with-icon">
                        <input type="text" class="form-input" id="name" placeholder="e.g. Rahul Sharma">
                        <i class="fa-solid fa-user input-icon"></i>
                    </div>
                </div>

                <!-- Email Address -->
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-with-icon">
                        <input type="email" class="form-input" id="email" placeholder="you@example.com">
                        <i class="fa-solid fa-envelope input-icon"></i>
                    </div>
                </div>

                <!-- Roll Number (Student only) -->
                <div class="form-group" id="rollNoField">
                    <label class="form-label">Roll Number</label>
                    <div class="input-with-icon">
                        <input type="text" class="form-input" id="rollno" placeholder="e.g. 2024001">
                        <i class="fa-solid fa-id-card input-icon"></i>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group" style="margin-bottom: 24px;">
                    <label class="form-label">Password</label>
                    <div class="input-with-icon">
                        <input type="password" class="form-input" id="password" placeholder="Create a password">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <button type="button" class="eye-toggle-btn" onclick="togglePassword('password', this)">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button class="btn-primary-block" onclick="register()">
                    <i class="fa-solid fa-user-plus"></i> Create Account
                </button>

                <div style="margin-top: 20px; text-align: center; font-size: 14px; color: var(--text-secondary);">
                    Already have an account? 
                    <a href="login.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Sign in here</a>
                </div>

            </div>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
