<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Dashboard
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <h1>
        Admin Dashboard
    </h1>

    <!-- STATS -->

    <center><div class="stats-container">

        <div class="stat-card">

            <h2 id="totalStudents">
                0
            </h2>

            <p>Total Students</p>

        </div>

        <div class="stat-card">

            <h2 id="totalTeachers">
                0
            </h2>

            <p>Total Teachers</p>

        </div>

        <div class="stat-card">

            <h2 id="totalSubjects">
                0
            </h2>

            <p>Total Subjects</p>

        </div>

        <div class="stat-card">

            <h2 id="totalSessions">
                0
            </h2>

            <p>Total Sessions</p>

        </div>

    </div></center>

    <!-- ADD SUBJECT -->

    <h2>Add Subject</h2>

    <input
        type="text"
        id="subjectName"
        placeholder="Enter Subject Name"
    >

    <button onclick="addSubject()">
        Add Subject
    </button>
<!-- SUBJECTS -->

<h2>All Subjects</h2>

<center><div id="subjectsList"></div></center>
  

    <!-- STUDENTS -->

    <h2>All Students</h2>

    <center><div id="studentsList"></div></center>

    <!-- TEACHERS -->

    <h2>All Teachers</h2>

    <center><div id="teachersList"></div></center>

    <!-- RESET ATTENDANCE -->
    <h2>Reset Attendance</h2>

    <button onclick="resetAttendance()">
        Reset All Attendance
    </button>

    <script src="script.js"></script>

</body>

</html>
