<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Dashboard
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

</head>

<body>
    <button
    class="home-btn"
    onclick="
        window.location.href='index.html'
    "
>

    <i class="fa-solid fa-house"></i>

    Home

</button>

    <h1>
        Admin Dashboard
    </h1>

    <!-- STATS -->

    <center><div class="stats-container">

        <div class="stat-card">

            <h2 id="totalStudents">
                0
            </h2>

            <p>Total Students</p>

        </div>

        <div class="stat-card">

            <h2 id="totalTeachers">
                0
            </h2>

            <p>Total Teachers</p>

        </div>

        <div class="stat-card">

            <h2 id="totalSubjects">
                0
            </h2>

            <p>Total Subjects</p>

        </div>

        <div class="stat-card">

            <h2 id="totalSessions">
                0
            </h2>

            <p>Total Sessions</p>

        </div>

    </div></center>

    <!-- ADD SUBJECT -->

    <h2>Add Subject</h2>

    <input
        type="text"
        id="subjectName"
        placeholder="Enter Subject Name"
    >

    <button class="admin-btn" onclick="addSubject()">
        Add Subject
    </button>
<!-- SUBJECTS -->

<h2>Subjects</h2>

<button class="admin-btn" onclick="loadSubjects()">
    Show Subjects
</button>

<center><div id="subjectsList"></div></center>

    <!-- STUDENTS -->

<h2>Students</h2>

<button class="admin-btn" onclick="loadStudents()">
    Show Registered Students
</button>

<center><div id="studentsList"></div></center>

    <!-- TEACHERS -->

    <h2>Teachers</h2>

<button class="admin-btn" onclick="loadTeachers()">
    Show Registered Teachers
</button>

<center><div id="teachersList"></div></center>

    <!-- RESET ATTENDANCE -->
    <h2>Reset Attendance</h2>

    <button class="admin-btn" onclick="resetAttendance()">
        Reset All Attendance
    </button>

    <script src="script.js"></script>

</body>

</html>
