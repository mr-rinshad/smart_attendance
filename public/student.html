<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4ff;
            min-height: 100vh;
        }

        /* ── TOP NAVBAR ── */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background: #fff;
            border-bottom: 1px solid #e5eaf5;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: 1.5px solid #dce6ff;
            border-radius: 10px;
            background: #fff;
            color: #2563eb;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav-btn:hover { background: #f0f4ff; }

        .navbar h1 {
            font-size: 26px;
            font-weight: 700;
            color: #111827;
        }

        /* ── PAGE BODY ── */
        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 24px;
        }

        /* Welcome text */
        .welcome {
            text-align: center;
            font-size: 17px;
            color: #6b7280;
            margin-bottom: 22px;
        }

        .welcome span {
            color: #2563eb;
            font-weight: 700;
        }

        /* ── SCAN BUTTON ── */
        .scan-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 520px;
            margin: 0 auto 28px auto;
            padding: 18px;
            background: #fff;
            border: 2px solid #2563eb;
            border-radius: 12px;
            color: #2563eb;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }

        .scan-btn:hover {
            background: #eff6ff;
            transform: scale(1.01);
        }

        /* QR reader */
        #reader {
            width: 300px;
            margin: 0 auto 12px auto;
        }

        #result {
            text-align: center;
            color: #2563eb;
            font-weight: 600;
            margin-bottom: 12px;
        }

        /* ── STATS CARD ── */
        .stats-card {
            background: #fff;
            border-radius: 16px;
            padding: 32px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 32px;
            box-shadow: 0 2px 12px rgba(37,99,235,0.06);
        }

        /* Left / Right stat block */
        .stat-block {
            flex: 1;
            text-align: center;
        }

        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin: 0 auto 10px auto;
        }

        .stat-icon.green { background: #dcfce7; color: #16a34a; }
        .stat-icon.blue  { background: #dbeafe; color: #2563eb; }

        .stat-label {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 6px;
        }

        .stat-number {
            font-size: 36px;
            font-weight: 800;
            line-height: 1;
        }

        .stat-number.green { color: #16a34a; }
        .stat-number.blue  { color: #2563eb; }

        .stat-sub {
            font-size: 14px;
            color: #9ca3af;
            margin-top: 4px;
        }

        /* Dividers inside stats card */
        .stat-divider {
            width: 1px;
            height: 90px;
            background: #e5eaf5;
        }

        /* ── CIRCLE CHART AREA ── */
        .circle-area {
            flex: 1.4;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .circle-area h3 {
            font-size: 15px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 14px;
        }

        .circle-wrap {
            position: relative;
            width: 180px;
            height: 180px;
        }

        .circle-wrap svg {
            transform: rotate(-90deg);
        }

        #circleText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        #circleText .pct {
            font-size: 26px;
            font-weight: 800;
            color: #111827;
            display: block;
        }

        #circleText .pct-label {
            font-size: 13px;
            color: #9ca3af;
        }

        #progressCircle {
            transition: stroke-dashoffset 1s ease;
        }

        /* ── SUBJECT ATTENDANCE ── */
        .section-title {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 16px;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 640px) {
            .subjects-grid { grid-template-columns: 1fr; }
            .stats-card { flex-direction: column; }
            .stat-divider { width: 90%; height: 1px; }
        }

        .subject-card {
            background: #fff;
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(37,99,235,0.05);
        }

        .subject-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .subject-name {
            font-size: 16px;
            font-weight: 700;
            color: #111827;
        }

        .subject-pct {
            font-size: 15px;
            font-weight: 700;
        }

        /* progress bar */
        .progress-bar-bg {
            height: 5px;
            background: #e5eaf5;
            border-radius: 99px;
            margin-bottom: 16px;
        }

        .progress-bar-fill {
            height: 5px;
            border-radius: 99px;
            transition: width 0.8s ease;
        }

        /* stats row inside each subject card */
        .subject-stats {
            display: flex;
            justify-content: space-around;
            border-top: 1px solid #f0f4ff;
            padding-top: 12px;
        }

        .sub-stat {
            text-align: center;
        }

        .sub-stat-label {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .sub-stat-value {
            font-size: 20px;
            font-weight: 800;
        }

        /* subject color classes */
        .c-purple { color: #7c3aed; }
        .c-blue   { color: #2563eb; }
        .c-green  { color: #16a34a; }
        .c-orange { color: #ea580c; }

        .bg-purple { background: #7c3aed; }
        .bg-blue   { background: #2563eb; }
        .bg-green  { background: #16a34a; }
        .bg-orange { background: #ea580c; }

        /* dividers between sub-stat columns */
        .sub-divider {
            width: 1px;
            background: #e5eaf5;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <button class="nav-btn" onclick="window.location.href='index.html'">
            <i class="fa-solid fa-house"></i> Home
        </button>
        <h1>Student Dashboard</h1>
        <button class="nav-btn" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
    </div>

    <!-- PAGE CONTENT -->
    <div class="page">

        <!-- Welcome -->
        <p class="welcome">Welcome, <span id="welcomeText">Student</span></p>

        <!-- Scan QR Button -->
        <button class="scan-btn" onclick="openScanner()">
            <i class="fa-solid fa-qrcode" style="font-size:22px;"></i>
            Scan QR to Mark Attendance
        </button>

        <!-- QR Reader -->
        <div id="reader"></div>
        <p id="result"></p>

        <!-- Stats Card -->
        <div class="stats-card">

            <!-- Total Present -->
            <div class="stat-block">
                <div class="stat-icon green">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <p class="stat-label">Total Present</p>
                <p class="stat-number green" id="presentCount">0</p>
                <p class="stat-sub">Classes</p>
            </div>

            <div class="stat-divider"></div>

            <!-- Circle -->
            <div class="circle-area">
                <h3>Overall Attendance</h3>
                <div class="circle-wrap">
                    <svg width="180" height="180">
                        <circle cx="90" cy="90" r="70"
                            stroke="#e6e6e6" stroke-width="14" fill="none"></circle>
                        <circle id="progressCircle"
                            cx="90" cy="90" r="70"
                            stroke="#16a34a" stroke-width="14" fill="none"
                            stroke-linecap="round"
                            stroke-dasharray="440"
                            stroke-dashoffset="440"></circle>
                    </svg>
                    <div id="circleText">
                        <span class="pct" id="pctText">0%</span>
                        <span class="pct-label">Overall</span>
                    </div>
                </div>
            </div>

            <div class="stat-divider"></div>

            <!-- Total Classes -->
            <div class="stat-block">
                <div class="stat-icon blue">
                    <i class="fa-regular fa-calendar"></i>
                </div>
                <p class="stat-label">Total Classes</p>
                <p class="stat-number blue" id="totalClasses">0</p>
                <p class="stat-sub">Classes</p>
            </div>

        </div>

        <!-- Subject Attendance -->
        <p class="section-title">Subject Attendance</p>

        <div class="subjects-grid" id="percentageList">
            <!-- Subject cards injected by JS -->
        </div>

    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="script.js"></script>

</body>
</html>
