<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Smart Attendance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4ff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background: #fff;
            border-bottom: 1px solid #e5eaf5;
        }
        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: 1.5px solid #dce6ff;
            border-radius: 10px;
            background: #fff;
            color: #2563eb;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }
        .nav-btn:hover { background: #f0f4ff; }
        .navbar-title {
            font-size: 20px;
            font-weight: 700;
            color: #111827;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar-title .logo-icon {
            width: 36px;
            height: 36px;
            background: #2563eb;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
        }
        /* spacer so title stays centered */
        .nav-spacer { width: 120px; }

        /* CENTER CONTENT */
        .center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
        }

        /* CARD */
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 28px 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 40px rgba(37,99,235,0.10);
        }

        /* Card header */
        .card-icon {
            width: 52px;
            height: 52px;
            background: #eff6ff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #2563eb;
            margin: 0 auto 12px auto;
        }
        .card h2 {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #111827;
            margin-bottom: 4px;
        }
        .card .subtitle {
            text-align: center;
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 20px;
        }

        /* INPUT GROUP */
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 7px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 15px;
        }
        .input-wrap input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border: 1.5px solid #e5eaf5;
            border-radius: 10px;
            font-size: 15px;
            color: #111827;
            background: #fafbff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-wrap input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
            background: #fff;
        }
        .input-wrap input::placeholder { color: #c4c9d4; }

        /* Eye toggle for password */
        .eye-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #9ca3af;
            font-size: 15px;
            padding: 0;
            width: auto;
            margin: 0;
        }

        /* PRIMARY BUTTON */
        .primary-btn {
            width: 100%;
            padding: 9px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s, transform 0.15s;
        }
        .primary-btn:hover { background: #1d4ed8; transform: scale(1.01); }

        /* DIVIDER */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 14px 0;
            color: #d1d5db;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5eaf5;
        }

        /* FOOTER LINK */
        .footer-link {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
        }
        .footer-link a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }
        .footer-link a:hover { text-decoration: underline; }

        /* COLLEGE BADGE at bottom */
        .college-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            padding: 9px;
            background: #f0f4ff;
            border-radius: 10px;
            font-size: 13px;
            color: #6b7280;
            font-weight: 500;
        }
        .college-badge i { color: #2563eb; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <button class="nav-btn" onclick="window.location.href='index.html'">
            <i class="fa-solid fa-house"></i> Home
        </button>
        <div class="navbar-title">
            <div class="logo-icon"><i class="fa-solid fa-qrcode"></i></div>
            Smart Attendance
        </div>
        <div class="nav-spacer"></div>
    </div>

    <!-- CENTER CARD -->
    <div class="center">
        <div class="card">

            <div class="card-icon">
                <i class="fa-solid fa-right-to-bracket"></i>
            </div>
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to your account to continue</p>

            <!-- Email -->
            <div class="input-group">
                <label>Email Address</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="you@example.com">
                </div>
            </div>

            <!-- Password -->
            <div class="input-group">
                <label>Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Enter your password" id="loginPassword">
                    <button class="eye-btn" onclick="togglePassword('loginPassword', this)" tabindex="-1">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Login Button -->
            <button class="primary-btn" onclick="login()">
                Sign In
            </button>

            <div class="divider">or</div>

            <p class="footer-link">
                Don't have an account? <a href="register.html">Register here</a>
            </p>

            <div class="college-badge">
                <i class="fa-solid fa-graduation-cap"></i>
                MEA Engineering College — QR Attendance System
            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
